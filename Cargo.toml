[package]
name = "blazer"
version = "0.1.0"
edition = "2021"
authors = ["Romi Shalom <romishalom01@gmail.com>"]
description = "A blazing fast, feature-rich library for styling and enhancing CLI output in Rust"
license = "MIT"
repository = "https://github.com/romishalom/blazer"
documentation = "https://docs.rs/blazer"
readme = "README.md"
keywords = ["cli", "terminal", "color", "style", "ansi"]
categories = ["command-line-interface", "visualization", "text-processing"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"